- insert:
    - id: agent-tier-coding-minimal
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: tier-coding-minimal
        name: Coding Minimal
        description: Nur Terminal, Dateien lesen/schreiben/suchen, Todo-Liste und Rückfragen.
